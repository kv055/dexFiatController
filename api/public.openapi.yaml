openapi: 3.1.0
info:
  title: dexFiatController public API
  version: 1.0.0
  description: Externally or browser-facing contract. This handwritten specification is the source of truth.
  contact:
    name: dexArbTrading maintainers
    url: https://github.com/kv055/dexArbTrading
servers:
  - url: http://localhost:8080
tags:
  - name: notify
  - name: phone-heartbeat
  - name: telegram-webhook
paths:
  /notify:
    post:
      operationId: postNotify
      tags:
        - notify
      summary: POST /notify
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Payment notification accepted for asynchronous processing
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /notify
      security:
        - webhookSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /phone-heartbeat:
    post:
      operationId: postPhoneHeartbeat
      tags:
        - phone-heartbeat
      summary: POST /phone-heartbeat
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /phone-heartbeat
      security:
        - webhookSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /telegram-webhook:
    post:
      operationId: postTelegramWebhook
      tags:
        - telegram-webhook
      summary: POST /telegram-webhook
      responses:
        "200":
          description: Telegram update accepted with no response body
        default:
          description: Telegram update rejected with no response body
      description: POST /telegram-webhook
      security:
        - webhookSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
components:
  securitySchemes:
    dashboardSession:
      type: apiKey
      in: cookie
      name: dex_session
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
    bearerWebhook:
      type: http
      scheme: bearer
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  schemas:
    APIError:
      $ref: ../../commons/api/openapi/APIError.yaml
    Health:
      $ref: ../../commons/api/openapi/Health.yaml
